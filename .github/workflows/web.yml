# Bygger webudgaven (til iPhone: åbn i Safari og "Føj til hjemmeskærm") og
# lægger den på GitHub Pages. Kræver: Settings -> Pages -> Source: GitHub Actions.
name: Webudgave

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Grafikmotoren (CanvasKit) pakkes med, så appen ikke afhænger af
      # Googles CDN.
      - run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
