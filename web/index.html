<!DOCTYPE html>
<html lang="da">
<head>
  <!-- Erstattes af værdien fra `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Log kampe og træning, sæt mål og følg din udvikling i badminton.">
  <meta name="theme-color" content="#1B7F5B">

  <!-- iPhone: kan lægges på hjemmeskærmen og åbnes som en app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Badminton">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Badminton-logbog</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #1B7F5B; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #fff;
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Indlæser Badminton-logbog …</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
